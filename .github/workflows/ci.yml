name: CCIP CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      SECRET_KEY: ci-pipeline-test-secret-key-32-bytes-long!
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      REDIS_URL: redis://localhost:6379/0
      MALWARE_SCANNER_TYPE: development
      STORAGE_VAULT_PATH: storage_vault
      LOG_LEVEL: INFO

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Verify Alembic Migrations
        run: |
          alembic upgrade head

      - name: Run Pytest Regression Suite
        run: |
          pytest tests/test_auth.py \
                 tests/test_complaints.py \
                 tests/test_workflow_lifecycle.py \
                 tests/test_security_audit_remediation.py \
                 tests/test_e2e_complete_pass.py \
                 tests/test_phase_k_e2e.py \
                 tests/test_production_hardening.py \
                 tests/test_investigation_chat.py \
                 tests/test_model_degraded_modes.py \
                 tests/test_multi_model_adapters.py \
                 tests/test_admin_rbac.py \
                 -v --tb=short

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          npm install

      - name: Run TypeScript & Vite Production Build
        run: |
          npm run build
